<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Shipli logo</title>
  <desc id="desc">Shipli wordmark with a code-readiness logo mark.</desc>
  <defs>
    <linearGradient id="tile" x1="72" y1="40" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10233A"/>
      <stop offset="0.48" stop-color="#0A1324"/>
      <stop offset="1" stop-color="#160B2B"/>
    </linearGradient>
    <linearGradient id="edge" x1="80" y1="48" x2="272" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E0F0"/>
      <stop offset="0.58" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A030E0"/>
    </linearGradient>
    <linearGradient id="check" x1="119" y1="194" x2="229" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30E060"/>
      <stop offset="1" stop-color="#00E0F0"/>
    </linearGradient>
    <linearGradient id="word" x1="336" y1="88" x2="744" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FEFF"/>
      <stop offset="0.62" stop-color="#CFFAFE"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#00E0F0" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#A030E0" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <rect x="40" y="40" width="240" height="240" rx="58" fill="url(#tile)"/>
    <rect x="48" y="48" width="224" height="224" rx="51" fill="none" stroke="url(#edge)" stroke-width="8"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M118 120 80 160l38 40" stroke="#00E0F0" stroke-width="19"/>
      <path d="M202 120 240 160l-38 40" stroke="#A030E0" stroke-width="19"/>
      <path d="M179 98 141 222" stroke="#93A4B8" stroke-width="16" opacity="0.85"/>
      <path d="m116 170 30 30 64-78" stroke="url(#check)" stroke-width="23"/>
    </g>
  </g>

  <text x="330" y="190"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="126" font-weight="800" letter-spacing="0" fill="url(#word)">Shipli</text>
  <path d="M335 220h410" stroke="#00E0F0" stroke-width="8" stroke-linecap="round" opacity="0.42"/>
</svg>
