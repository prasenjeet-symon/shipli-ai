<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Shipli logo mark</title>
  <desc id="desc">A rounded dark app tile with code brackets and a green readiness check.</desc>
  <defs>
    <linearGradient id="tile" x1="72" y1="56" x2="440" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10233A"/>
      <stop offset="0.48" stop-color="#0A1324"/>
      <stop offset="1" stop-color="#160B2B"/>
    </linearGradient>
    <linearGradient id="edge" x1="88" y1="72" x2="424" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E0F0"/>
      <stop offset="0.58" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A030E0"/>
    </linearGradient>
    <linearGradient id="check" x1="171" y1="312" x2="354" y2="181" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30E060"/>
      <stop offset="1" stop-color="#00E0F0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00E0F0" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#A030E0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="38" y="38" width="436" height="436" rx="104" fill="url(#tile)" filter="url(#soft-shadow)"/>
  <rect x="52" y="52" width="408" height="408" rx="92" fill="none" stroke="url(#edge)" stroke-width="14"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 184 112 256l68 72" stroke="#00E0F0" stroke-width="34"/>
    <path d="M332 184 400 256l-68 72" stroke="#A030E0" stroke-width="34"/>
    <path d="M290 146 222 366" stroke="#93A4B8" stroke-width="28" opacity="0.85"/>
    <path d="m178 272 54 54 116-140" stroke="url(#check)" stroke-width="42"/>
  </g>
</svg>
